services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  frontend:
    image: node:22-slim
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    command: npx --yes serve -l 3000
    ports:
      - "3000:3000"
